<svg xmlns="http://www.w3.org/2000/svg" width="620" height="310">
  <style>
    .label { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #333; }
    .grid { stroke: #e0e0e0; stroke-width: 1; stroke-dasharray: 4,4; }
    .axis { stroke: #333; stroke-width: 2; }
    .bar-ok { fill: #4CAF50; rx: 4; ry: 4; }
    .bar-late { fill: #E53935; rx: 4; ry: 4; }
    .text-time { font-family: Arial, sans-serif; font-size: 11px; fill: #ffffff; font-weight: bold; }
    .text-axis { font-family: Arial, sans-serif; font-size: 12px; fill: #555; }
    .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #111; }
  </style>

  <rect width="100%" height="100%" fill="#ffffff" />
  <text x="20" y="30" class="title">Diagrama de Gantt - Primer Plan Óptimo (Penalización: 0)</text>
  <line x1="80" y1="50" x2="80" y2="270" class="grid" />
  <text x="80" y="288" text-anchor="middle" class="text-axis">0</text>
  <line x1="120" y1="50" x2="120" y2="270" class="grid" />
  <text x="120" y="288" text-anchor="middle" class="text-axis">1</text>
  <line x1="160" y1="50" x2="160" y2="270" class="grid" />
  <text x="160" y="288" text-anchor="middle" class="text-axis">2</text>
  <line x1="200" y1="50" x2="200" y2="270" class="grid" />
  <text x="200" y="288" text-anchor="middle" class="text-axis">3</text>
  <line x1="240" y1="50" x2="240" y2="270" class="grid" />
  <text x="240" y="288" text-anchor="middle" class="text-axis">4</text>
  <line x1="280" y1="50" x2="280" y2="270" class="grid" />
  <text x="280" y="288" text-anchor="middle" class="text-axis">5</text>
  <line x1="320" y1="50" x2="320" y2="270" class="grid" />
  <text x="320" y="288" text-anchor="middle" class="text-axis">6</text>
  <line x1="360" y1="50" x2="360" y2="270" class="grid" />
  <text x="360" y="288" text-anchor="middle" class="text-axis">7</text>
  <line x1="400" y1="50" x2="400" y2="270" class="grid" />
  <text x="400" y="288" text-anchor="middle" class="text-axis">8</text>
  <line x1="440" y1="50" x2="440" y2="270" class="grid" />
  <text x="440" y="288" text-anchor="middle" class="text-axis">9</text>
  <line x1="480" y1="50" x2="480" y2="270" class="grid" />
  <text x="480" y="288" text-anchor="middle" class="text-axis">10</text>
  <line x1="520" y1="50" x2="520" y2="270" class="grid" />
  <text x="520" y="288" text-anchor="middle" class="text-axis">11</text>
  <line x1="560" y1="50" x2="560" y2="270" class="grid" />
  <text x="560" y="288" text-anchor="middle" class="text-axis">12</text>
  <line x1="80" y1="270" x2="560" y2="270" class="axis" />
  <text x="65" y="82" text-anchor="end" class="label">Tarea A</text>
  <rect x="80" y="65" width="120" height="26" class="bar-ok" />
  <text x="88" y="82" class="text-time">[0 - 3] (Plazo: 5)</text>
  <text x="65" y="122" text-anchor="end" class="label">Tarea B</text>
  <rect x="200" y="105" width="80" height="26" class="bar-ok" />
  <text x="208" y="122" class="text-time">[3 - 5] (Plazo: 6)</text>
  <text x="65" y="162" text-anchor="end" class="label">Tarea C</text>
  <rect x="280" y="145" width="160" height="26" class="bar-ok" />
  <text x="288" y="162" class="text-time">[5 - 9] (Plazo: 10)</text>
  <text x="65" y="202" text-anchor="end" class="label">Tarea D</text>
  <rect x="440" y="185" width="80" height="26" class="bar-ok" />
  <text x="448" y="202" class="text-time">[9 - 11] (Plazo: 12)</text>
  <text x="65" y="242" text-anchor="end" class="label">Tarea E</text>
  <rect x="520" y="225" width="40" height="26" class="bar-ok" />
  <text x="528" y="242" class="text-time">[11 - 12] (Plazo: 15)</text>
  <rect x="80" y="282" width="14" height="14" class="bar-ok" />
  <text x="100" y="292" class="text-axis">A tiempo</text>
  <rect x="180" y="282" width="14" height="14" class="bar-late" />
  <text x="200" y="292" class="text-axis">Fuera de plazo</text>
</svg>
